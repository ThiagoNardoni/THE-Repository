<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE Engenharia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#16a34a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="THE Obras">
    <link rel="apple-touch-icon" href="/icon-192.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
      }

      // Helper to read shared file from IndexedDB (com tempo-limite embutido,
      // pra nunca deixar a página esperando pra sempre)
      window.getSharedFile = () => {
        const tentativa = new Promise((resolve) => {
          try {
            const req = indexedDB.open('the-obras', 1)
            req.onupgradeneeded = () => req.result.createObjectStore('shared')
            req.onsuccess = () => {
              try {
                const db = req.result
                const tx = db.transaction('shared', 'readwrite')
                const store = tx.objectStore('shared')
                const getFile = store.get('pending')
                const getStatus = store.get('pending_status')
                tx.oncomplete = () => {
                  if (getFile.result || getStatus.result) {
                    store.delete('pending'); store.delete('pending_status')
                    resolve({ file: getFile.result || null, status: getStatus.result || null })
                  } else {
                    resolve(null)
                  }
                }
                tx.onerror = () => resolve({ file: null, status: 'erro_tx: ' + (tx.error?.message || 'desconhecido') })
                tx.onabort = () => resolve({ file: null, status: 'tx_abortada' })
              } catch (err) {
                resolve({ file: null, status: 'erro_transacao: ' + err.message })
              }
            }
            req.onerror = () => resolve({ file: null, status: 'erro_abrir_db: ' + (req.error?.message || 'desconhecido') })
            req.onblocked = () => resolve({ file: null, status: 'db_bloqueado' })
          } catch (err) {
            resolve({ file: null, status: 'erro_geral: ' + err.message })
          }
        })
        const timeout = new Promise((resolve) => setTimeout(() => resolve({ file: null, status: 'timeout_indexeddb' }), 5000))
        return Promise.race([tentativa, timeout])
      }
    </script>
  </body>
</html>
