<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THE Engenharia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#16a34a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="THE Obras">
    <link rel="apple-touch-icon" href="/icon-192.png">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
      }

      // Helper to read shared file from Cache Storage (com tempo-limite embutido,
      // pra nunca deixar a página esperando pra sempre)
      window.getSharedFile = () => {
        const tentativa = (async () => {
          try {
            const cache = await caches.open('the-obras-share')
            const [fileResp, statusResp] = await Promise.all([
              cache.match('/__shared-file'),
              cache.match('/__shared-status')
            ])
            if (!fileResp && !statusResp) return null

            const status = statusResp ? await statusResp.text() : 'ok'
            let file = null
            if (fileResp) {
              const blob = await fileResp.blob()
              const nome = decodeURIComponent(fileResp.headers.get('X-File-Name') || 'comprovante')
              const tipo = fileResp.headers.get('Content-Type') || blob.type
              file = new File([blob], nome, { type: tipo })
            }
            await cache.delete('/__shared-file')
            await cache.delete('/__shared-status')
            return { file, status }
          } catch (err) {
            return { file: null, status: 'erro_cache: ' + err.message }
          }
        })()
        const timeout = new Promise((resolve) => setTimeout(() => resolve({ file: null, status: 'timeout_cache' }), 5000))
        return Promise.race([tentativa, timeout])
      }
    </script>
  </body>
</html>
